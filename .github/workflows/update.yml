name: Update branded search

on:
  schedule:
    - cron: '17 0 * * 1' # Monday 09:17 JST
  workflow_dispatch:
    inputs:
      publish:
        description: '検証後にPagesへ公開（初回確認はfalse）'
        type: boolean
        default: false
      gsc_compare:
        description: 'GSC取得を元シートと照合（書込・公開なし）'
        type: boolean
        default: false
      comparison_end_date:
        description: '照合の取得終端 YYYY-MM-DD（空欄ならJSTの3日前）'
        type: string
        default: ''
      gsc_rehearsal:
        description: '検証Sheetだけで保存・復元を試す（公開・比較と同時指定不可）'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: branded-search-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'facilo-corp/branded-search-monitoring' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true' && !inputs.gsc_rehearsal && (github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test aggregation and failure handling
        run: python -m unittest discover -s tests -v
      - name: Check configuration
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          WIF_PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          COMPARE: ${{ inputs.gsc_compare }}
          PUBLISH: ${{ inputs.publish }}
          COLLECTOR: ${{ vars.GOOGLE_COLLECTOR_SERVICE_ACCOUNT }}
        run: |
          python -c "import os; assert all(os.environ.get(k) for k in ('SHEET_ID', 'WIF_PROVIDER', 'SERVICE_ACCOUNT')), 'Google configuration is incomplete'"
          python -c "import os; c=os.environ.get('COMPARE')=='true'; assert not(c and os.environ.get('PUBLISH')=='true'), 'Compare mode cannot publish'; assert not c or os.environ.get('COLLECTOR'), 'Collector configuration is incomplete'"
      - name: Authenticate collector for read-only comparison
        if: github.event_name == 'workflow_dispatch' && inputs.gsc_compare
        id: collector_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Collect and compare without writing
        if: github.event_name == 'workflow_dispatch' && inputs.gsc_compare
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.collector_auth.outputs.access_token }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          COMPARISON_END_DATE: ${{ inputs.comparison_end_date }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'branded-collection'
          args = [sys.executable, 'src/collect_gsc.py', '--output-dir', str(folder)]
          if os.environ.get('COMPARISON_END_DATE'):
              args += ['--end-date', os.environ['COMPARISON_END_DATE']]
          code = subprocess.call(args)
          if code:
              raise SystemExit(code)
          subprocess.run([sys.executable, 'src/dashboard.py', '--input', str(folder / 'snapshot-candidate.json'), '--output', str(folder / 'candidate.html')], check=True)
          subprocess.run([sys.executable, 'src/verify_site.py', '--file', str(folder / 'candidate.html')], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('GSC取得・同期間照合・候補ページの検証に成功。シート書込・Pages公開はありません。\n')
          PY
      - name: Remove private comparison files
        if: always() && github.event_name == 'workflow_dispatch' && inputs.gsc_compare
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          target = root / 'branded-collection'
          assert target.resolve().parent == root and not target.is_symlink()
          if target.exists():
              shutil.rmtree(target)
          PY
      - name: Authenticate with short-lived Google credentials
        if: '!inputs.gsc_compare'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read and build (no Sheet writes)
        if: '!inputs.gsc_compare'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          python src/fetch_sheet.py --output "$RUNNER_TEMP/branded-source.json"
          python src/dashboard.py --input "$RUNNER_TEMP/branded-source.json"
          python src/verify_site.py --file site/index.html
      - name: Remove private source snapshot
        if: always()
        run: |
          python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'branded-source.json').unlink(missing_ok=True)"
      - name: Digest and public build summary
        if: '!inputs.gsc_compare'
        id: digest
        run: |
          python - <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from dashboard import extract_metadata
          payload = Path('site/index.html').read_bytes()
          meta = extract_metadata(payload.decode('utf-8'))
          digest = hashlib.sha256(payload).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha256=' + digest + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"期間: {meta['periodStart']} ～ {meta['periodEnd']} / {meta['weeks']}週\n\n")
              f.write(f"表示回数: {meta['impressions']:,} / クリック: {meta['clicks']:,}\n\n")
              f.write(f"元データ最終日: {meta['sourceLatestDay']}\n\nSHA256: `{digest}`\n")
          PY
      - name: Commit only the validated public HTML
        id: commit
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update branded search dashboard'
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload validated site only
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  rehearse:
    if: github.repository == 'facilo-corp/branded-search-monitoring' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.gsc_rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      REHEARSAL_ENABLED: ${{ vars.REHEARSAL_ENABLED }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      REHEARSAL_SHEET_ID: ${{ vars.REHEARSAL_SHEET_ID }}
      REHEARSAL_BACKUP_FOLDER_ID: ${{ vars.REHEARSAL_BACKUP_FOLDER_ID }}
      REHEARSE: ${{ inputs.gsc_rehearsal }}
      COMPARE: ${{ inputs.gsc_compare }}
      PUBLISH: ${{ inputs.publish }}
      COMPARISON_END_DATE: ${{ inputs.comparison_end_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate rehearsal target and mode before authentication
        run: python src/rehearse_cutover.py --check-config
      - name: Test failure handling
        run: python -m unittest discover -s tests -v
      - name: Authenticate reader
        id: rehearsal_reader
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate collector with edit access only to the test Sheet
        id: rehearsal_collector
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_COLLECTOR_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/spreadsheets
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate backup account
        id: rehearsal_backup
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_BACKUP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Save, read back and restore the test Sheet
        env:
          GOOGLE_READER_TOKEN: ${{ steps.rehearsal_reader.outputs.access_token }}
          GOOGLE_COLLECTOR_TOKEN: ${{ steps.rehearsal_collector.outputs.access_token }}
          GOOGLE_BACKUP_TOKEN: ${{ steps.rehearsal_backup.outputs.access_token }}
        run: python src/rehearse_cutover.py

  deploy:
    needs: build
    if: ${{ !inputs.gsc_rehearsal && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the generated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify exact delivery and noindex
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
        run: python src/verify_site.py --url https://facilo-corp.github.io/branded-search-monitoring/ --sha256 "$EXPECTED_SHA"
